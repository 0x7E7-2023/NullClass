# 打 tag（v*）触发：构建签名 APK 并发布到 GitHub Release。
# 签名构建跑在自托管 runner 上（nullclass-release，标签 release）：
#   签名材料保存在 runner 所在服务器本地（/opt/nullclass-runner/keystore，
#   容器内只读挂载 /opt/keystore），GitHub 上零签名秘密。
# 服务器运维要点：
#   - 重建 runner 容器后需重新注册：gh api -X POST
#     repos/0x7E7-2023/NullClass/actions/runners/registration-token 取新 token，
#     docker run 时经 RUNNER_TOKEN 注入（见 /opt/nullclass-runner/image/）
#   - Android SDK / Gradle 缓存 / toolcache 在 /opt/nullclass-runner/ 下的持久卷
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: [self-hosted, release]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 runner 本地的 env 文件加载签名配置（不经过 GitHub Secrets）
      - name: Load signing config (server-local)
        run: |
          set -e
          . /opt/keystore/signing.env
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # ABI 拆分后每个架构一个包；universal 作为兜底（模拟器 / 未知 ABI）
          files: |
            app/build/outputs/apk/release/app-*-release.apk
