[versions]
agp = "9.3.0"
kotlin = "2.4.10"
ksp = "2.3.11"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.0"
room = "2.8.4"
datastore = "1.2.1"
hilt = "2.60.1"
